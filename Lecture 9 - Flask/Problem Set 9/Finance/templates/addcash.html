{% extends "layout.html" %}

{% block title %}Add Cash{% endblock %}

{% block main %}
<h2 class="mb-4">Add Cash to Your Account</h2>

<form action="/addcash" method="post">
    <div class="mb-3">
        <input autofocus
            class="form-control mx-auto w-auto"
            min="1"
            name="amount"
            placeholder="Amount in USD"
            step="0.01"
            type="number">
    </div>
    <button class="btn btn-primary" type="submit">Add Cash</button>
</form>

<p class="mt-3"><a href="/"><- Back to Portfolio</a></p>
{% endblock %}
