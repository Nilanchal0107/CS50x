{% extends "layout.html" %}

{% block title %}Sell{% endblock %}

{% block main %}
<h2 class="mb-4">Sell Shares</h2>

<form action="/sell" method="post">

    <!-- Dropdown populated by Flask with stocks the user currrently owns -->
    <!-- holdings is passed from app.py: [{"symbol": "AAPL", "total_shares": 5}, ...] -->
    <div class="mb-3">
        <select class="form-select mx-auto w-auto" name="symbol">
            <option disabled selected value="">Select a stock</option>
            {% for h in holdings %}
                <option value="{{ h.symbol }}">
                    {{ h.symbol }} ({{ h.total_shares }} shares)
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <input class="form-control mx-auto w-auto"
            min="1"
            name="shares"
            placeholder="Number of Shares to Sell"
            type="number">
    </div>

    <button class="btn btn-danger" type="submit">Sell</button>

</form>
{% endblock %}
